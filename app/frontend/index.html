<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0d0d; --panel: #181818; --panel-2: #222; --border: #2a2a2a;
    --text: #f5f5f5; --muted: #a3a3a3;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .tone-high     { --c: #e5484d; --c2: #5c1015; --c3: #2a0709; }
  .tone-standard { --c: #5b9bff; --c2: #10295c; --c3: #07142d; }
  .tone-light    { --c: #4cc38a; --c2: #0f3b26; --c3: #071d13; }
  .tone-skip     { --c: #b4b4b4; --c2: #2c2c2c; --c3: #161616; }

  /* ---------- views ---------- */
  .view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
    transition: opacity .45s var(--ease), transform .45s var(--ease); }
  .view.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }
  #category.hidden { transform: translateY(24px); }

  /* ---------- nav ---------- */
  .nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 270px 18px 48px; background: linear-gradient(to bottom, rgba(13,13,13,.95), rgba(13,13,13,0)); }
  .logo { font-weight: 500; letter-spacing: .2em; font-size: 20px; color: #e5484d; text-transform: uppercase; }
  .logo span { color: var(--text); font-weight: 500; letter-spacing: .02em; text-transform: none; font-size: 14px; margin-left: 12px; opacity: .7; }
  .search { background: rgba(0,0,0,.6); border: 1px solid #444; color: var(--text); border-radius: 6px;
    padding: 9px 14px; width: 260px; outline: none; transition: border-color .2s, width .3s var(--ease); }
  .search:focus { border-color: #888; width: 320px; }
  .mock { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #3a2e10; color: #f2c14e; margin-left: 10px; }

  /* ---------- hero ---------- */
  .hero { position: relative; margin: -70px 0 0; padding: 130px 48px 56px; min-height: 380px;
    background: radial-gradient(ellipse at 75% 30%, var(--c2) 0%, transparent 60%),
                linear-gradient(to right, var(--bg) 25%, transparent 70%), var(--c3); }
  .hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 120px; background: linear-gradient(transparent, var(--bg)); }
  .hero-inner { position: relative; z-index: 1; max-width: 620px; animation: rise .8s var(--ease) both; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--c); }
  .eyebrow::before { content: ""; width: 18px; height: 3px; background: var(--c); border-radius: 2px; }
  .hero h1 { font-size: 64px; line-height: 1; margin: 14px 0 12px; font-weight: 300; letter-spacing: -.02em; }
  .hero .meta { color: #d4d4d4; font-size: 15px; margin-bottom: 10px; }
  .hero .meta b { color: #4cc38a; }
  .hero p { font-size: 18px; line-height: 1.5; color: #e5e5e5; margin: 0 0 22px; }
  .hero-big { position: absolute; right: 6%; top: 50%; transform: translateY(-50%); font-size: 200px; font-weight: 200; letter-spacing: -.05em; text-align: right;
    color: var(--c); opacity: .16; line-height: 1; pointer-events: none; }
  .hero-big small { display: block; font-size: 28px; letter-spacing: .3em; text-transform: uppercase; margin-top: 8px; }
  .btns { display: flex; gap: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 26px; border-radius: 6px; font-weight: 500; font-size: 16px;
    transition: transform .15s, background .2s; }
  .btn:hover { transform: scale(1.04); }
  .btn.primary { background: #fff; color: #000; }
  .btn.primary:hover { background: #e2e2e2; }
  .btn.ghost { background: rgba(109,109,110,.6); color: #fff; }
  .btn.ghost:hover { background: rgba(109,109,110,.4); }

  /* ---------- verdict cards (home) ---------- */
  .section { padding: 0 48px 48px; }
  .section h2 { font-size: 20px; font-weight: 500; margin: 0 0 14px; }
  .verdicts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .vcard { position: relative; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; text-align: left; padding: 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(circle at 80% 0%, var(--c2), transparent 70%), linear-gradient(160deg, var(--c3), #0a0a0a);
    border: 1px solid rgba(255,255,255,.06);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .3s;
    animation: rise .7s var(--ease) both; }
  .vcard:nth-child(2) { animation-delay: .07s } .vcard:nth-child(3) { animation-delay: .14s } .vcard:nth-child(4) { animation-delay: .21s }
  .vcard:hover { transform: scale(1.05); z-index: 2; border-color: var(--c); box-shadow: 0 20px 50px rgba(0,0,0,.7), 0 0 0 1px var(--c); }
  .vcard .count { font-size: 120px; font-weight: 200; line-height: .9; color: var(--c); letter-spacing: -.04em;
    transition: transform .35s var(--ease); }
  .vcard:hover .count { transform: translateY(-4px); }
  .vcard .label { font-size: 22px; font-weight: 500; }
  .vcard .blurb { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .vcard .peek { display: flex; margin-top: 16px; }
  .vcard .peek span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; font-size: 14px;
    background: var(--c2); color: var(--c); border: 2px solid #0d0d0d; margin-right: -8px; }
  .vcard .open { position: absolute; right: 18px; bottom: 20px; font-size: 13px; font-weight: 500; color: var(--c);
    opacity: 0; transform: translateX(-6px); transition: all .3s var(--ease); }
  .vcard:hover .open { opacity: 1; transform: none; }

  /* ---------- lead cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
  .lcard { position: relative; text-align: left; display: flex; flex-direction: column; justify-content: flex-start; border-radius: 8px; overflow: hidden; background: var(--panel);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease); animation: rise .55s var(--ease) both; }
  .lcard:hover { transform: scale(1.06); z-index: 3; box-shadow: 0 18px 40px rgba(0,0,0,.75); }
  .poster { position: relative; height: 130px; padding: 14px 16px; display: flex; align-items: flex-end;
    background: radial-gradient(circle at 85% 15%, var(--c2), transparent 65%), linear-gradient(135deg, var(--c3), #111); }
  .poster .initial { position: absolute; right: 10px; top: -14px; font-size: 120px; font-weight: 300; color: var(--c); opacity: .18; line-height: 1; }
  .poster .rank { position: absolute; left: 14px; top: 12px; font-size: 11px; font-weight: 500; letter-spacing: .1em; color: var(--c); }
  .newbadge { position: absolute; left: 14px; top: 12px; font-size: 10px; letter-spacing: .12em; padding: 2px 7px; border-radius: 3px; background: var(--c); color: #000; }
  .aibadge { position: absolute; right: 12px; top: 12px; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(0,0,0,.45); color: #c9b6ff; border: 1px solid rgba(201,182,255,.35); }
  .ai-note { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: #c9b6ff; }
  .gem-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 9px 18px; border-radius: 999px;
    font-size: 14px; color: #e9e1ff; background: linear-gradient(90deg, rgba(124,92,255,.35), rgba(66,133,244,.35));
    border: 1px solid rgba(201,182,255,.45); transition: transform .15s, background .2s; }
  .gem-btn:hover:not([disabled]) { transform: scale(1.03); background: linear-gradient(90deg, rgba(124,92,255,.55), rgba(66,133,244,.55)); }
  .gem-btn.sm { margin: 0 0 14px; padding: 6px 14px; font-size: 13px; }
  .gem-btn.busy { cursor: progress; opacity: .85; }
  .gem-done { margin-top: 16px; font-size: 13px; color: #c9b6ff; }
  .spin { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .poster h3 { margin: 0; font-size: 21px; font-weight: 500; line-height: 1.1; position: relative; }
  .lbody { padding: 12px 16px 16px; }
  .lmeta { display: flex; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .lmeta .ppl { color: var(--text); font-weight: 500; }
  .lwhy { font-size: 14px; color: #d4d4d4; line-height: 1.45; }
  .dup { color: var(--muted); font-style: italic; }

  /* ---------- company folders ---------- */
  .fcard { position: relative; text-align: left; display: block; padding: 0; border-radius: 8px; animation: rise .55s var(--ease) both;
    transition: transform .3s var(--ease); margin: 10px 10px 0 0; }
  .fcard::before, .fcard::after { content: ""; position: absolute; inset: 0; border-radius: 8px; background: var(--panel);
    border: 1px solid rgba(255,255,255,.06); transition: transform .3s var(--ease); }
  .fcard::before { transform: translate(10px, -10px); opacity: .45; }
  .fcard::after  { transform: translate(5px, -5px);  opacity: .75; }
  .fcard:hover { transform: scale(1.05); z-index: 3; }
  .fcard:hover::before { transform: translate(16px, -16px) rotate(1.5deg); }
  .fcard:hover::after  { transform: translate(8px, -8px) rotate(.75deg); }
  .fcard .inner { position: relative; z-index: 1; border-radius: 8px; overflow: hidden; background: var(--panel);
    box-shadow: 0 10px 30px rgba(0,0,0,.5); height: 100%; }
  .fcard .poster h3 { display: flex; align-items: center; gap: 10px; }
  .ftag { position: absolute; left: 14px; top: 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
  .flist { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; color: #cfcfcf; line-height: 1.7; }
  .flist li { display: flex; justify-content: space-between; gap: 10px; }
  .flist li span:last-child { color: var(--muted); white-space: nowrap; }
  .flist .more { color: var(--c); }
  .crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .crumbs button { color: var(--muted); padding: 0; transition: color .2s; }
  .crumbs button:hover { color: var(--text); }

  /* ---------- category page ---------- */
  .cat-hero { position: relative; margin-top: -70px; padding: 110px 48px 36px;
    background: radial-gradient(ellipse at 80% 0%, var(--c2), transparent 65%), linear-gradient(to bottom, var(--c3), var(--bg)); }
  .back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; font-size: 14px; margin-bottom: 18px;
    transition: color .2s, transform .2s; }
  .back:hover { color: var(--text); transform: translateX(-3px); }
  .cat-title { display: flex; align-items: baseline; gap: 18px; }
  .cat-title h1 { font-size: 56px; font-weight: 300; margin: 0; letter-spacing: -.02em; }
  .cat-title .n { font-size: 56px; font-weight: 300; color: var(--c); }
  .cat-hero p { color: var(--muted); font-size: 16px; margin: 8px 0 0; }
  .tabs { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid #3a3a3a; color: var(--muted); transition: all .2s; }
  .tab:hover { color: var(--text); border-color: #666; }
  .tab.active { background: var(--c); border-color: var(--c); color: #000; }
  .empty { color: var(--muted); padding: 40px 0; }

  /* ---------- zoom overlay for card → page transition ---------- */
  .zoom { position: fixed; z-index: 20; border-radius: 10px; pointer-events: none;
    background: radial-gradient(circle at 80% 0%, var(--c2), transparent 70%), linear-gradient(160deg, var(--c3), #0a0a0a);
    transition: all .5s var(--ease); }

  /* ---------- modal ---------- */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.7); display: flex; justify-content: center;
    align-items: flex-start; padding: 40px 20px; overflow-y: auto; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .modal { width: min(820px, 100%); background: var(--panel); border-radius: 10px; overflow: hidden;
    transform: scale(.92) translateY(20px); transition: transform .4s var(--ease); box-shadow: 0 30px 80px rgba(0,0,0,.8); }
  .scrim.show .modal { transform: none; }
  .m-hero { position: relative; height: 240px; padding: 28px 36px; display: flex; flex-direction: column; justify-content: flex-end;
    background: radial-gradient(circle at 85% 10%, var(--c2), transparent 65%), linear-gradient(135deg, var(--c3), #141414); }
  .m-hero::after { content: ""; position: absolute; inset: auto 0 0 0; height: 80px; background: linear-gradient(transparent, var(--panel)); }
  .m-hero .initial { position: absolute; right: 30px; top: -20px; font-size: 220px; font-weight: 300; color: var(--c); opacity: .15; line-height: 1; }
  .m-hero h2 { position: relative; z-index: 1; font-size: 44px; margin: 0; font-weight: 300; letter-spacing: -.02em; }
  .m-hero .sub { position: relative; z-index: 1; color: #d4d4d4; margin-top: 6px; }
  .close { position: absolute; right: 16px; top: 16px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; background: #181818;
    display: grid; place-items: center; font-size: 18px; transition: transform .2s; }
  .close:hover { transform: rotate(90deg); }
  .m-body { padding: 8px 36px 34px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; background: var(--c); color: #000; }
  .m-row { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .m-row .ppl { color: #4cc38a; font-weight: 500; }
  .m-why { font-size: 17px; line-height: 1.5; margin: 0 0 18px; }
  .h { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
  ul { margin: 0; padding-left: 18px; line-height: 1.7; color: #e0e0e0; }
  .dossier div { font-size: 14px; margin-bottom: 8px; color: #e0e0e0; }
  .dossier span { color: var(--muted); text-transform: capitalize; }
  .proposal { position: relative; white-space: pre-wrap; background: #0f0f0f; border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; line-height: 1.6; font-size: 14px; color: #e0e0e0; }
  .proposal .md { white-space: normal; }
  .md b { font-weight: 500; color: #fff; }
  .md-h1 { font-size: 18px; color: #fff; margin: 6px 0 4px; }
  .md-h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); margin: 14px 0 4px; }
  .md-li { padding-left: 16px; position: relative; }
  .md-li::before { content: "•"; position: absolute; left: 2px; color: var(--c); }
  .md-gap { height: 8px; }
  .mail-btn { margin-top: 14px; padding: 10px 22px; border-radius: 6px; font-size: 15px; background: #fff; color: #000;
    transition: transform .15s, background .2s; }
  .mail-btn:hover { transform: scale(1.04); background: #e2e2e2; }
  .mail { margin-top: 14px; border: 1px solid var(--border); border-radius: 8px; background: #0f0f0f; padding: 16px;
    font-size: 14px; line-height: 1.6; color: #e0e0e0; animation: rise .4s var(--ease) both; }
  .mail-status { color: #4cc38a; font-size: 13px; margin-bottom: 12px; }
  .mail-head { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; }
  .mail-head span { display: inline-block; width: 64px; color: var(--muted); }
  .copy { position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 4px; background: #fff; color: #000; }
  .muted { color: var(--muted); font-size: 14px; }
  .linkish { color: var(--c); font-weight: 500; font-size: 14px; padding: 0; }
  .linkish:hover { text-decoration: underline; }
  .full { grid-column: 1 / -1; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  @media (max-width: 900px) {
    .verdicts { grid-template-columns: repeat(2, 1fr); }
    .nav, .section, .hero, .cat-hero { padding-left: 20px; padding-right: 20px; }
    .hero h1 { font-size: 42px; }
    .m-body { grid-template-columns: 1fr; padding: 8px 20px 24px; }
    .search { width: 160px; } .search:focus { width: 200px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <!-- HOME -->
  <div id="home" class="view">
    <nav class="nav">
      <div class="logo">Catering Hunter<span id="total"></span></div>
      <input class="search" id="q-home" placeholder="Search companies, events…" />
    </nav>
    <header class="hero" id="hero"></header>
    <section class="section" id="results" style="display:none">
      <h2>Search results</h2><div class="grid" id="results-grid"></div>
    </section>
    <section class="section">
      <h2>Your verdicts</h2>
      <div class="verdicts" id="verdicts"></div>
    </section>
  </div>

  <!-- CATEGORY -->
  <div id="category" class="view hidden">
    <nav class="nav">
      <div class="logo">Catering Hunter</div>
      <input class="search" id="q-cat" placeholder="Search in this list…" />
    </nav>
    <header class="cat-hero" id="cat-hero"></header>
    <section class="section"><div class="grid" id="cat-grid"></div></section>
  </div>

  <!-- DETAIL MODAL -->
  <div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
let DATA = [];          // set by Streamlit on every render
let byId = {};
let USING_MOCK = false;
let AI_ON = false;      // Gemini key present
let pending = null;     // Gemini request in flight: {nonce, label}
let lastOpenLead = null;
let started = false;

const VERDICTS = [
  { key: 'high',     label: 'High-effort pitch', blurb: 'Big deals worth a custom pitch' },
  { key: 'standard', label: 'Standard proposal', blurb: 'Send a templated proposal' },
  { key: 'light',    label: 'Light outreach',    blurb: 'A quick email or call' },
  { key: 'skip',     label: 'Skip',              blurb: 'Not worth chasing' },
];
const V = Object.fromEntries(VERDICTS.map(v => [v.key, v]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sortLeads = arr => [...arr].sort((a, b) => (b.people || 0) - (a.people || 0));
const inVerdict = k => sortLeads(DATA.filter(a => a.verdict === k));
const matches = (a, q) => !q || ['company', 'title', 'why', 'location'].some(f => (a[f] || '').toLowerCase().includes(q));

let current = null;   // open category key
let folder = null;    // open company folder inside a category

// tiny markdown: ## headings, - bullets, **bold**
function md(text) {
  return String(text || '').split('\n').map(line => {
    let l = esc(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^#{1,2}\s/.test(line)) return `<div class="md-h1">${l.replace(/^#+\s*/, '')}</div>`;
    if (/^#{3,}\s/.test(line)) return `<div class="md-h2">${l.replace(/^#+\s*/, '')}</div>`;
    if (/^\s*[-•*]\s/.test(line)) return `<div class="md-li">${l.replace(/^\s*[-•*]\s*/, '')}</div>`;
    return line.trim() ? `<div>${l}</div>` : '<div class="md-gap"></div>';
  }).join('');
}

function whyText(a) {
  const o = byId[a.duplicate_of];
  return o ? `<span class="dup">⧉ Duplicate of ${esc(o.company)} · ${esc(o.title)}</span>` : esc(a.why);
}
function eventLine(a) {
  return [a.title, a.location && a.location !== 'Kochi' ? a.location : null, a.date].filter(Boolean).map(esc).join(' · ');
}

/* ---------- home ---------- */
function renderHome() {
  $('#total').innerHTML = `${DATA.length} announcements${USING_MOCK ? '<span class="mock">mock data</span>' : ''}`;

  const feat = inVerdict('high')[0] || sortLeads(DATA)[0];
  const hero = $('#hero');
  if (feat) {
    const v = V[feat.verdict];
    hero.className = `hero tone-${feat.verdict}`;
    hero.innerHTML = `
      <div class="hero-big">${feat.people ?? ''}<small>guests</small></div>
      <div class="hero-inner">
        <div class="eyebrow">#1 lead · ${v.label}</div>
        <h1>${esc(feat.company)}</h1>
        <div class="meta"><b>${feat.people ?? '–'} people</b> &nbsp;·&nbsp; ${eventLine(feat)}</div>
        <p>${esc(feat.why)}</p>
        <div class="btns">
          <button class="btn primary" data-open="${feat.id}">▶ Open pitch</button>
          <button class="btn ghost" data-cat="${feat.verdict}">ⓘ See all ${v.label}</button>
        </div>
      </div>`;
  }

  $('#verdicts').innerHTML = VERDICTS.map(v => {
    const list = inVerdict(v.key);
    return `
      <button class="vcard tone-${v.key}" data-cat="${v.key}">
        <div>
          <div class="label">${v.label}</div>
          <div class="blurb">${v.blurb}</div>
          <div class="peek">${list.slice(0, 4).map(a => `<span title="${esc(a.company)}">${esc(a.company[0])}</span>`).join('')}</div>
        </div>
        <div class="count">${list.length}</div>
        <div class="open">Browse →</div>
      </button>`;
  }).join('');
}

function leadCard(a, i, showRank, inFolder = false) {
  return `
    <button class="lcard tone-${a.verdict}" data-open="${a.id}" style="animation-delay:${Math.min(i, 12) * 0.045}s">
      <div class="poster">
        <div class="initial">${esc(a.company[0])}</div>
        ${showRank ? `<div class="rank">${showRank}</div>` : ''}
        ${a.is_new ? '<div class="newbadge">NEW</div>' : ''}
        ${a.ai?.length ? '<div class="aibadge">✨ Gemini</div>' : ''}
        <h3>${esc(inFolder ? a.title : a.company)}</h3>
      </div>
      <div class="lbody">
        <div class="lmeta"><span class="ppl">${a.people ?? '–'} people</span><span>${inFolder ? [a.location, a.date].filter(Boolean).map(esc).join(' · ') : eventLine(a)}</span></div>
        <div class="lwhy">${whyText(a)}</div>
      </div>
    </button>`;
}

/* ---------- company folders ---------- */
function groupByCompany(list) {
  const groups = new Map();
  list.forEach(a => { if (!groups.has(a.company)) groups.set(a.company, []); groups.get(a.company).push(a); });
  return [...groups.entries()]
    .map(([company, leads]) => ({ company, leads: sortLeads(leads) }))
    .sort((x, y) => (y.leads[0].people || 0) - (x.leads[0].people || 0));
}

const FOLDER_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

function folderCard(g, key, i) {
  const total = g.leads.reduce((s, a) => s + (a.people || 0), 0);
  const shown = g.leads.slice(0, 3);
  return `
    <button class="fcard tone-${key}" data-folder="${esc(g.company)}" style="animation-delay:${Math.min(i, 12) * 0.045}s">
      <div class="inner">
        <div class="poster">
          <div class="initial">${esc(g.company[0])}</div>
          <div class="ftag">${FOLDER_ICON} ${g.leads.length} events</div>
          ${g.leads.every(a => a.ai && a.ai.length) ? '<div class="aibadge">✨ Gemini</div>' : ''}
          <h3>${esc(g.company)}</h3>
        </div>
        <div class="lbody">
          <div class="lmeta"><span class="ppl">${total} people total</span></div>
          <ul class="flist">
            ${shown.map(a => `<li><span>${esc(a.title)}</span><span>${esc(a.date || '')}</span></li>`).join('')}
            ${g.leads.length > 3 ? `<li class="more">+${g.leads.length - 3} more</li>` : ''}
          </ul>
        </div>
      </div>
    </button>`;
}

/* ---------- category ---------- */
function renderCategory(key, q = '') {
  const v = V[key];
  const list = inVerdict(key);
  const shown = list.filter(a => matches(a, q));
  const hero = $('#cat-hero');
  hero.className = `cat-hero tone-${key}`;

  if (folder) {   // inside a company folder
    const leads = sortLeads(shown.filter(a => a.company === folder));
    const all = list.filter(a => a.company === folder);
    hero.innerHTML = `
      <div class="crumbs"><button data-home>Verdicts</button>›<button data-unfolder>${v.label}</button>›<span>${esc(folder)}</span></div>
      <div class="cat-title"><h1>${esc(folder)}</h1><span class="n">${all.length}</span></div>
      <p>${all.length} events in ${v.label.toLowerCase()} · ${all.reduce((s, a) => s + (a.people || 0), 0)} people total</p>
      ${geminiButton(all, `${esc(folder)}'s ${all.length > 1 ? 'events' : 'event'}`)}`;
    $('#cat-grid').innerHTML = leads.length
      ? leads.map((a, i) => leadCard(a, i, '', true)).join('')
      : '<div class="empty">Nothing here for that search.</div>';
    return;
  }

  hero.innerHTML = `
    <button class="back" data-home>‹ Back to verdicts</button>
    <div class="cat-title"><h1>${v.label}</h1><span class="n">${list.length}</span></div>
    <p>${v.blurb}</p>
    ${geminiButton(list, v.label)}
    <div class="tabs">${VERDICTS.map(o =>
      `<button class="tab tone-${o.key} ${o.key === key ? 'active' : ''}" data-switch="${o.key}">${o.label} · ${inVerdict(o.key).length}</button>`).join('')}
    </div>`;
  const groups = groupByCompany(shown);
  $('#cat-grid').innerHTML = groups.length
    ? groups.map((g, i) => g.leads.length > 1
        ? folderCard(g, key, i)
        : leadCard(g.leads[0], i, '')).join('')
    : `<div class="empty">Nothing here${q ? ' for that search' : ''}.</div>`;
}

/* ---------- Gemini (on demand) ---------- */
const canAnalyze = a => a.verdict !== 'skip' && !(a.ai && a.ai.length);

function geminiButton(leads, label) {
  if (!AI_ON) return '';
  const todo = leads.filter(canAnalyze);
  if (pending) return `<button class="gem-btn busy" disabled><span class="spin"></span> Gemini is analysing ${esc(pending.label)}…</button>`;
  if (!todo.length) {
    const done = leads.some(a => a.ai && a.ai.length);
    return done ? '<div class="gem-done">✨ Analysed by Gemini</div>' : '';
  }
  const ids = todo.map(a => a.id).join(',');
  return `<button class="gem-btn" data-analyze="${ids}" data-label="${esc(label)}">✨ Analyse ${todo.length} ${todo.length === 1 ? 'lead' : 'leads'} with Gemini</button>`;
}

function requestAnalysis(ids, label) {
  if (pending || !ids.length) return;
  pending = { nonce: Date.now() + Math.random(), label };
  sendToStreamlit({ action: 'analyze', ids, label, nonce: pending.nonce });
  refresh();
}

/* ---------- transitions ---------- */
function openCategory(key, fromEl) {
  current = key; folder = null;
  $('#q-cat').value = '';
  renderCategory(key);
  $('#category').scrollTop = 0;

  if (fromEl) {
    // zoom the clicked card up to full screen, then reveal the page
    const r = fromEl.getBoundingClientRect();
    const z = document.createElement('div');
    z.className = `zoom tone-${key}`;
    Object.assign(z.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
    document.body.appendChild(z);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      Object.assign(z.style, { left: 0, top: 0, width: '100vw', height: '100vh', borderRadius: 0 });
    }));
    $('#home').classList.add('hidden');
    setTimeout(() => {
      $('#category').classList.remove('hidden');
      z.style.opacity = 0;
      setTimeout(() => z.remove(), 500);
    }, 380);
  } else {
    $('#home').classList.add('hidden');
    $('#category').classList.remove('hidden');
  }
}

function switchCategory(key) {
  const grid = $('#cat-grid');
  grid.style.transition = 'opacity .2s'; grid.style.opacity = 0;
  setTimeout(() => {
    current = key; folder = null; $('#q-cat').value = '';
    renderCategory(key);
    grid.style.opacity = 1;
  }, 200);
}

function zoomFrom(el, key, after) {
  const r = el.getBoundingClientRect();
  const z = document.createElement('div');
  z.className = `zoom tone-${key}`;
  Object.assign(z.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  document.body.appendChild(z);
  requestAnimationFrame(() => requestAnimationFrame(() =>
    Object.assign(z.style, { left: 0, top: 0, width: '100vw', height: '100vh', borderRadius: 0 })));
  setTimeout(() => { after(); z.style.opacity = 0; setTimeout(() => z.remove(), 500); }, 380);
}

function openFolder(company, fromEl) {
  zoomFrom(fromEl, current, () => {
    folder = company; $('#q-cat').value = '';
    renderCategory(current);
    $('#category').scrollTop = 0;
  });
}

function closeFolder() {
  const grid = $('#cat-grid'), hero = $('#cat-hero');
  [grid, hero].forEach(el => { el.style.transition = 'opacity .2s'; el.style.opacity = 0; });
  setTimeout(() => {
    folder = null; $('#q-cat').value = '';
    renderCategory(current);
    [grid, hero].forEach(el => (el.style.opacity = 1));
  }, 200);
}

function goHome() {
  current = null; folder = null;
  $('#category').classList.add('hidden');
  setTimeout(() => $('#home').classList.remove('hidden'), 120);
}

/* ---------- modal ---------- */
function openLead(id, keepScroll = false) {
  const a = byId[id]; if (!a) return;
  const v = V[a.verdict] || V.skip;
  const orig = byId[a.duplicate_of];
  const modal = $('#modal');
  modal.className = `modal tone-${a.verdict}`;
  modal.dataset.id = id;
  modal.innerHTML = `
    <div class="m-hero">
      <button class="close" data-close>✕</button>
      <div class="initial">${esc(a.company[0])}</div>
      <h2>${esc(a.company)}</h2>
      <div class="sub">${[a.title, a.location, a.date].filter(Boolean).map(esc).join(' · ')}</div>
    </div>
    <div class="m-body">
      <div>
        <div class="m-row"><span class="pill">${v.label}</span><span class="ppl">${a.people ?? '–'} people</span>
          ${a.source ? `<a class="linkish" href="${esc(a.source)}" target="_blank" rel="noreferrer">Source ↗</a>` : ''}
          <span class="ai-note">${a.ai?.length ? '✨ ' + a.ai.map(x => x[0].toUpperCase() + x.slice(1)).join(' & ') + ' by Gemini' : 'Rule-based'}</span></div>
        ${AI_ON && canAnalyze(a) ? (pending
            ? `<button class="gem-btn sm busy" disabled><span class="spin"></span> Gemini is analysing ${esc(pending.label)}…</button>`
            : `<button class="gem-btn sm" data-analyze="${a.id}" data-label="${esc(a.company)}">✨ Analyse this lead with Gemini</button>`) : ''}
        <p class="m-why">${whyText(a)}</p>
        ${orig ? `<button class="linkish" data-open="${orig.id}">Open original: ${esc(orig.company)} →</button>` : ''}
        <div class="h">Reasoning</div>
        ${a.reasoning?.length ? `<ul>${a.reasoning.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '<div class="muted">No detailed reasoning yet.</div>'}
      </div>
      <div>
        <div class="h">Dossier</div>
        ${a.dossier ? `<div class="dossier">${Object.entries(a.dossier).map(([k, val]) => `<div><span>${esc(k)}:</span> ${esc(val)}</div>`).join('')}</div>`
                    : '<div class="muted">No dossier yet.</div>'}
      </div>
      <div class="full">
        <div class="h">Proposal</div>
        ${a.proposal ? `<div class="proposal"><button class="copy" data-copy="${a.id}">Copy</button><div class="md">${md(a.proposal)}</div></div>`
                     : `<div class="muted">${a.verdict === 'skip' ? 'Skipped — no proposal needed.' : 'No proposal drafted yet.'}</div>`}
        ${canMail(a) ? mailBlock(a) : ''}
      </div>
    </div>`;
  $('#scrim').classList.add('show');
  if (!keepScroll) $('#scrim').scrollTop = 0;
}
const closeLead = () => $('#scrim').classList.remove('show');

/* ---------- "Send mail" (simulated) ----------
   The brief forbids real email: "sending" = rendering the fully formatted email on screen.
   Nothing leaves the app; sent state lives only in this browser tab. */
const SENDER = 'Apex Corporate Catering Co.';
const sentMail = {};   // lead id -> time it was "sent"

const canMail = a => a.proposal && ['high', 'standard', 'light'].includes(a.verdict) && a.tier !== 'needs_research';

function mailParts(a) {
  const lines = String(a.proposal).split('\n').filter(l => !/draft for human review/i.test(l));
  const subjIdx = lines.findIndex(l => /^\s*\**subject:/i.test(l));
  const subject = subjIdx >= 0
    ? lines[subjIdx].replace(/^\s*\**subject:\**\s*/i, '').replace(/\*\*/g, '')
    : `Catering for ${a.company}'s ${a.title || 'event'}${a.date ? ' on ' + a.date : ''}`;
  const body = lines.filter((_, i) => i !== subjIdx).join('\n').trim();
  return { subject, body };
}

function mailBlock(a) {
  const sent = sentMail[a.id];
  if (!sent) return `<button class="mail-btn" data-mail="${a.id}">✉ Send mail</button>`;
  const { subject, body } = mailParts(a);
  return `
    <div class="mail">
      <div class="mail-status">✓ Sent (simulated) at ${esc(sent)} — rendered here only, no email left this app</div>
      <div class="mail-head">
        <div><span>From</span>${esc(SENDER)} &lt;events@apex-catering.example&gt;</div>
        <div><span>To</span>${esc(a.company)} — [event organiser's email]</div>
        <div><span>Subject</span>${esc(subject)}</div>
      </div>
      <div class="md">${md(body)}</div>
    </div>`;
}

function sendMail(id) {
  sentMail[id] = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  openLead(id, true);
}

function copyText(text, btn) {
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = 'Copy'), 1500); };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch (e) {} t.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-mail],[data-open],[data-cat],[data-home],[data-switch],[data-close],[data-copy],[data-folder],[data-unfolder],[data-analyze]');
  if (e.target.id === 'scrim') return closeLead();
  if (!t) return;
  if (t.dataset.analyze) return requestAnalysis(t.dataset.analyze.split(','), t.dataset.label || 'leads');
  if (t.dataset.mail) return sendMail(t.dataset.mail);
  if (t.dataset.copy) return copyText(byId[t.dataset.copy].proposal, t);
  if (t.dataset.open) return openLead(t.dataset.open);
  if (t.dataset.folder) return openFolder(t.dataset.folder, t);
  if ('unfolder' in t.dataset) return closeFolder();
  if (t.dataset.cat) return openCategory(t.dataset.cat, t.classList.contains('vcard') ? t : null);
  if (t.dataset.switch) return switchCategory(t.dataset.switch);
  if ('home' in t.dataset) return goHome();
  if ('close' in t.dataset) return closeLead();
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#scrim').classList.contains('show')) closeLead();
  else if (folder) closeFolder();
  else if (current) goHome();
});

$('#q-home').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const box = $('#results');
  if (!q) { box.style.display = 'none'; return; }
  const hits = sortLeads(DATA.filter(a => matches(a, q)));
  box.style.display = '';
  $('#results-grid').innerHTML = hits.length ? hits.map((a, i) => leadCard(a, i)).join('') : '<div class="empty">No matches.</div>';
});
$('#q-cat').addEventListener('input', e => renderCategory(current, e.target.value.trim().toLowerCase()));

/* ---------- Streamlit two-way component protocol ---------- */
function sendToStreamlit(value) {
  window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setComponentValue', value, dataType: 'json' }, '*');
}
function setHeight() {
  let h = 900;
  try { h = Math.max(600, window.parent.innerHeight); } catch (e) {}
  window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: h }, '*');
}

// Re-draw whatever is on screen with fresh data, keeping the user where they are.
function refresh() {
  renderHome();
  if (current) renderCategory(current, $('#q-cat').value.trim().toLowerCase());
  const q = $('#q-home').value;
  if (q) $('#q-home').dispatchEvent(new Event('input'));
  const openId = $('#scrim').classList.contains('show') && $('#modal').dataset.id;
  if (openId) openLead(openId, true);
}

window.addEventListener('message', e => {
  const msg = e.data;
  if (!msg || msg.type !== 'streamlit:render') return;
  const args = msg.args || {};
  DATA = JSON.parse(args.data || '[]').map(a => ({ ...a, company: String(a.company || 'Unknown').replace(/\s+\d+$/, '') }));
  byId = Object.fromEntries(DATA.map(a => [a.id, a]));
  USING_MOCK = !!args.mock;
  AI_ON = !!args.gemini;
  if (pending && args.ack === pending.nonce) pending = null;
  refresh();
  if (!started) { started = true; setHeight(); }
  if (args.open_lead && args.open_lead !== lastOpenLead) {
    lastOpenLead = args.open_lead;
    setTimeout(() => openLead(args.open_lead), 300);
  }
});
window.addEventListener('resize', setHeight);
window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1 }, '*');
</script>
</body>
</html>
